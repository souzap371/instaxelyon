<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Acesso · ELYON</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-brand">
            <img src="/images/elyon-logo.png" alt="ELYON Marketing e Tecnologia">
            <div>
                <div class="eyebrow">INSTAGRAM INTELLIGENCE</div>
                <h1>Estratégia orientada por evidências.</h1>
                <p>Diagnóstico visual e editorial de perfis públicos do Instagram.</p>
            </div>
        </section>
        <section class="panel login-card">
            <span class="tag">ACESSO RESTRITO</span>
            <h2>Entrar na plataforma</h2>
            <div class="alert" th:if="${param.error}">Usuário ou senha inválidos.</div>
            <div class="success" th:if="${param.logout}">Sessão encerrada com segurança.</div>
            <form th:action="@{/login}" method="post">
                <label for="username">Usuário</label>
                <input id="username" name="username" autocomplete="username" required autofocus>
                <label for="password">Senha</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button class="primary" type="submit">Entrar</button>
            </form>
        </section>
    </main>
</body>
</html>
