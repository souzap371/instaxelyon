services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY:?Defina OPENAI_API_KEY}"
      OPENAI_MODEL: "gpt-4.1-mini"
      APP_PASSWORD: "${APP_PASSWORD:?Defina APP_PASSWORD}"
      SPRING_DATASOURCE_URL: "jdbc:h2:file:/data/elyon"
      META_APP_ID: "${META_APP_ID:-}"
      META_APP_SECRET: "${META_APP_SECRET:-}"
      META_REDIRECT_URI: "${META_REDIRECT_URI:-http://localhost:8080/trafego/callback}"
      META_TOKEN_ENCRYPTION_KEY: "${META_TOKEN_ENCRYPTION_KEY:-}"
      META_GRAPH_VERSION: "${META_GRAPH_VERSION:-v26.0}"
      META_WRITE_ENABLED: "${META_WRITE_ENABLED:-false}"
    volumes:
      - elyon_data:/data
    restart: unless-stopped
volumes:
  elyon_data:
